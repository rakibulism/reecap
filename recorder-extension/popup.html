<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { color-scheme: light dark; }
      body { width: 240px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; background: #fff; color: #18181b; }
      @media (prefers-color-scheme: dark) { body { background: #18181b; color: #fafafa; } }
      h1 { font-size: 14px; margin: 0 0 4px; }
      p { font-size: 12px; opacity: 0.7; margin: 0 0 14px; line-height: 1.4; }
      button { width: 100%; height: 40px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff; }
      button.start { background: #ef4444; }
      button.stop { background: #18181b; }
      @media (prefers-color-scheme: dark) { button.stop { background: #3f3f46; } }
    </style>
  </head>
  <body>
    <h1>Reecap Recorder</h1>
    <p>Record this tab. Every click becomes a smooth zoom in Reecap.</p>
    <button id="btn" class="start">Start recording</button>
    <script src="popup.js"></script>
  </body>
</html>
